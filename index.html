<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Local Lang</title>
  </head>
  <body>
      <nav id="toolbar">
        <ul>
          <li id="library-toolbar-btn">
            <img src="./src/assets/images/lucide--library.svg" alt="Library">
            <p>Library</p>
          </li>
          <li id="ai-models-toolbar-btn">
            <img src="./src/assets/images/lucide--brain-cog.svg" alt="AI models">
            <p>AI models</p>
          </li>
        </ul>
      </nav>
      <main>
        <div id="lesson-modal">
          <div id="lesson-modal-header">
            <form id="search-form">
              <input type="search" id="lesson-search-input" placeholder="Search library">
              <img src="./src/assets/images/lucide--search.svg" alt="Search">
            </form>
            <button id="import-lesson-btn"><img src="./src/assets/images/lucide--download.svg" alt="Import lesson">Import lesson</button>
          </div>
          <h1>Lesson Library</h1>
          <div id="lesson-list"></div>
        </div>
        <div id="import-modal" hidden>
          <input id="lesson-title-input" placeholder="Enter lesson title..."></input>
          <br>
          <input id="lesson-body-input" placeholder="Paste the article text here..."></input>
          <br>
          <button id="add-lesson-btn">Add lesson</button>
        </div>
        <div id="download-modal" hidden>
          <p>LocalLang can install free AI models to pronounce words and translate text, all without internet.</p>
          <input id="word-to-translate" value="Bonjour">
          <button id="translate-btn">Translate</button>

          <div class="model-card">
            <p>Pronunciation Model</p>
            <p>Size: 1.5 MB</p>
            <button id="download-pronunciation-model-btn">Download pronunciation model</button>
          </div>
          <div class="model-card">
            <p>Translation Model</p>
            <p>Size: 2.0 MB</p>
            <button id="download-translation-model-btn">Download translation model</button>
          </div>
          <p id="status">Status: Not downloading.</p>
        </div>
        <div id="lesson-page" hidden>
          <button id="back-btn">Back</button>
          <h1 id="lesson-title-display">Lesson title</h1>
          <p id="lesson-body-display">Lesson body</p>
        </div>

        <div id="word-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="word-modal-title">
          <button id="word-modal-close" class="modal-close" aria-label="Close word details">×</button>
          <h2 id="word-modal-title">Word details</h2>
          <div id="word-modal-definition" class="word-field"></div>
          <div class="word-field">
            <label for="word-modal-familiarity">Familiarity</label>
            <select id="word-modal-familiarity">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </div>
          <div class="word-field">
            <label for="word-modal-notes">Notes</label>
            <textarea id="word-modal-notes" rows="5" placeholder="Add notes for this word..."></textarea>
          </div>
          <button id="word-modal-save">Save</button>
        </div>
      </main>
  </body>
  <script type="module" src="./src/renderer.js"></script>
</html>
